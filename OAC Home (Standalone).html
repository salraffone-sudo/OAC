  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"dark\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>OAC — Owner · Architect · Contractor<\u002Ftitle>\n<style>/* Webfonts: Roboto, Roboto Serif (from style guide); Stardos Stencil (nearest Google match for the OAC stencil display letterforms) */\n\n@font-face {\n  font-family: 'Roboto';\n  font-style: italic;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"ba9d702d-53a8-4cef-b88c-3bb27c547901\") format('woff2');\n}\n\n@font-face {\n  font-family: 'Roboto';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"d05e2874-55be-4969-87eb-ea33a71288c2\") format('woff2');\n}\n\n@font-face {\n  font-family: 'Roboto';\n  font-style: normal;\n  font-weight: 500;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"eb485ab5-5e2e-42c4-853d-d3f9f6d51935\") format('woff2');\n}\n\n@font-face {\n  font-family: 'Roboto';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"fad8fe1c-4d5a-4c1a-9b7a-56bfc961d4f6\") format('woff2');\n}\n\n@font-face {\n  font-family: 'Roboto Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"935a6435-fad8-448b-86f9-4914ebf700af\") format('woff2');\n}\n\n@font-face {\n  font-family: 'Roboto Serif';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"8c79217a-3968-4f08-a1ea-15c3534fa7bc\") format('woff2');\n}\n\n@font-face {\n  font-family: 'Roboto Serif';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"fa097a6f-f6e2-4ad7-9eb1-8478eb8c5b09\") format('woff2');\n}\n\n@font-face {\n  font-family: 'Stardos Stencil';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"3ad703ed-ff37-4b62-86f8-a3b31dec9073\") format('woff2');\n}\n\n@font-face {\n  font-family: 'Stardos Stencil';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d096a79a-4727-4a8d-8529-a5f0d57d49d2\") format('woff2');\n}\n\n/* OAC color tokens — sourced from \"OAC style gide.pdf\" (exact hex values, light + dark mode) */\n\n:root {\n  /* Base palette */\n  --oac-navy: #073763;\n  --oac-blue-light: #CFE2F3;\n  --oac-red: #990000;\n  --oac-rose: #EA9999;\n  --oac-ink: #434343;\n  --oac-cream: #E5DECC;\n  --oac-gray-light: #EFEFEF;\n  --oac-white: #FFFFFF;\n\n  /* Semantic aliases — light mode */\n  --surface-page: var(--oac-gray-light);\n  --surface-card: var(--oac-white);\n  --surface-tint: var(--oac-cream);\n  --surface-accent: var(--oac-blue-light);\n  --surface-inverse: var(--oac-ink);\n\n  --text-body: var(--oac-ink);\n  --text-heading: var(--oac-navy);\n  --text-muted: #6b6b6b;\n  --text-on-dark: var(--oac-gray-light);\n  --text-on-accent: var(--oac-white);\n\n  --accent-primary: var(--oac-navy);\n  --accent-primary-soft: var(--oac-blue-light);\n  --accent-danger: var(--oac-red);\n  --accent-danger-soft: var(--oac-rose);\n\n  --border-default: #c9c9c9;\n  --border-strong: var(--oac-ink);\n  --link: var(--oac-navy);\n  --link-hover: var(--oac-red);\n\n  /* Hatch texture — nod to the hand-sketched, hatched logomark */\n  --texture-hatch: repeating-linear-gradient(45deg, currentColor 0, currentColor 1px, transparent 1px, transparent 5px); /* @kind other */\n}\n\n[data-theme=\"dark\"] {\n  --surface-page: var(--oac-ink);\n  --surface-card: #4e4e4e;\n  --surface-tint: #3a3a3a;\n  --surface-accent: var(--oac-navy);\n  --surface-inverse: var(--oac-gray-light);\n\n  --text-body: var(--oac-gray-light);\n  --text-heading: var(--oac-blue-light);\n  --text-muted: #ababab;\n  --text-on-dark: var(--oac-gray-light);\n  --text-on-accent: var(--oac-white);\n\n  --accent-primary: var(--oac-blue-light);\n  --accent-primary-soft: var(--oac-navy);\n  --accent-danger: var(--oac-rose);\n  --accent-danger-soft: var(--oac-red);\n\n  --border-default: #5f5f5f;\n  --border-strong: var(--oac-gray-light);\n  --link: var(--oac-blue-light);\n  --link-hover: var(--oac-rose);\n}\n\n/* OAC typography tokens — Roboto (body) + Roboto Serif (headline) per style guide.\n   Stardos Stencil substitutes for the stencil letterforms of the OAC logomark (flagged). */\n\n:root {\n  --font-body: 'Roboto', system-ui, sans-serif;\n  --font-display: 'Roboto Serif', Georgia, serif;\n  --font-stencil: 'Stardos Stencil', var(--font-display);\n\n  /* Scale */\n  --text-xs: 12px;\n  --text-sm: 14px;\n  --text-md: 16px;\n  --text-lg: 20px;\n  --text-xl: 26px;\n  --text-2xl: 34px;\n  --text-3xl: 46px;\n\n  --leading-tight: 1.15;\n  --leading-heading: 1.25;\n  --leading-body: 1.6;\n\n  --tracking-caps: 0.08em;   /* stencil / label caps */\n  --tracking-wide: 0.14em;   /* eyebrow labels, INSPIRATION-style headers */\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n}\n\n/* OAC spacing, radii, borders, shadows, motion */\n\n:root {\n  /* Spacing — 4px base */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n\n  /* Radii — engineering-drawing crispness: near-square corners */\n  --radius-sm: 2px;\n  --radius-md: 3px;\n  --radius-lg: 6px;\n  --radius-pill: 999px;\n\n  /* Borders */\n  --border-hairline: 1px solid var(--border-default);\n  --border-rule: 1.5px solid var(--border-strong);\n\n  /* Shadows — flat, drafting-table restraint */\n  --shadow-card: 0 1px 2px rgba(67, 67, 67, 0.12);\n  --shadow-raised: 0 2px 8px rgba(67, 67, 67, 0.18);\n  --shadow-overlay: 0 8px 28px rgba(67, 67, 67, 0.28);\n\n  /* Motion — quick, precise, no bounce */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 200ms; /* @kind other */\n}\n\n/* OAC base element styles */\n\nbody {\n  font-family: var(--font-body);\n  font-size: var(--text-md);\n  line-height: var(--leading-body);\n  color: var(--text-body);\n  background: var(--surface-page);\n  margin: 0;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  color: var(--text-heading);\n  line-height: var(--leading-heading);\n  margin: 0 0 var(--space-3);\n}\n\na { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 2px; }\na:hover { color: var(--link-hover); }\n\n::selection { background: var(--oac-blue-light); color: var(--oac-navy); }\n\n<\u002Fstyle>\n<style>/* OAC site styles — composes with the OAC design-system tokens */\n\nhtml { scroll-behavior: smooth; }\n\nbody {\n  -webkit-font-smoothing: antialiased;\n}\n\n/* ---------- Nav ---------- */\n.site-nav {\n  position: sticky;\n  top: 0;\n  z-index: 10;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 24px;\n  padding: 18px 40px;\n  background: var(--surface-page);\n  border-bottom: 1px solid var(--border-default);\n}\n.site-nav .brand {\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  text-decoration: none;\n}\n.site-nav .brand img { height: 34px; display: block; }\n.site-nav .brand span {\n  font-family: var(--font-body);\n  font-size: var(--text-xs);\n  letter-spacing: var(--tracking-wide);\n  color: var(--text-muted);\n  text-transform: uppercase;\n}\n.site-nav ul {\n  display: flex;\n  gap: 32px;\n  list-style: none;\n  margin: 0;\n  padding: 0;\n}\n.site-nav ul a {\n  font-family: var(--font-body);\n  font-size: var(--text-sm);\n  font-weight: var(--weight-medium);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  text-decoration: none;\n  color: var(--text-body);\n  padding-bottom: 4px;\n  border-bottom: 1.5px solid transparent;\n  transition: color 150ms ease, border-color 150ms ease;\n}\n.site-nav ul a:hover { color: var(--link-hover); }\n.site-nav ul a[aria-current=\"page\"] {\n  color: var(--text-heading);\n  border-bottom-color: var(--accent-danger);\n}\n\n/* ---------- Layout ---------- */\n.page {\n  max-width: 1060px;\n  margin: 0 auto;\n  padding: 0 40px;\n}\n\n.eyebrow {\n  font-family: var(--font-body);\n  font-size: var(--text-sm);\n  font-weight: var(--weight-medium);\n  letter-spacing: var(--tracking-wide);\n  text-transform: uppercase;\n  color: var(--text-muted);\n  display: flex;\n  align-items: center;\n  gap: 16px;\n  margin: 0 0 20px;\n}\n.eyebrow::after {\n  content: \"\";\n  flex: 1;\n  height: 1px;\n  background: var(--border-default);\n}\n.eyebrow .tick { color: var(--accent-danger); }\n\n/* ---------- Hero ---------- */\n.hero {\n  padding: 96px 0 88px;\n}\n.hero .mark { height: 130px; display: block; margin-bottom: 40px; }\n.hero .disciplines {\n  font-family: var(--font-body);\n  font-size: var(--text-sm);\n  font-weight: var(--weight-medium);\n  letter-spacing: var(--tracking-wide);\n  text-transform: uppercase;\n  color: var(--oac-rose);\n  margin: 0 0 24px;\n}\n.hero h1 {\n  font-size: clamp(40px, 5.4vw, 64px);\n  font-weight: var(--weight-bold);\n  line-height: var(--leading-tight);\n  letter-spacing: -0.01em;\n  max-width: 17ch;\n  margin: 0 0 28px;\n  text-wrap: pretty;\n}\n.hero .lede {\n  font-size: var(--text-lg);\n  line-height: var(--leading-body);\n  max-width: 58ch;\n  margin: 0 0 40px;\n  color: var(--text-body);\n  text-wrap: pretty;\n}\n.hero .byline {\n  font-family: var(--font-display);\n  font-size: var(--text-lg);\n  color: var(--text-heading);\n  margin: 0 0 40px;\n}\n.hero .byline small {\n  display: block;\n  font-family: var(--font-body);\n  font-size: var(--text-sm);\n  color: var(--text-muted);\n  margin-top: 4px;\n}\n\n/* ---------- Buttons ---------- */\n.btn-row { display: flex; gap: 16px; flex-wrap: wrap; }\n.btn {\n  display: inline-block;\n  font-family: var(--font-body);\n  font-size: var(--text-sm);\n  font-weight: var(--weight-semibold);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  text-decoration: none;\n  padding: 14px 28px;\n  border-radius: 3px;\n  white-space: nowrap;\n  transition: background 150ms ease, color 150ms ease, border-color 150ms ease;\n}\n.btn-primary {\n  background: var(--oac-red);\n  color: var(--oac-white);\n  border: 1.5px solid var(--oac-red);\n}\n.btn-primary:hover { background: #7a0000; border-color: #7a0000; color: var(--oac-white); }\n.btn-secondary {\n  background: transparent;\n  color: var(--text-body);\n  border: 1.5px solid var(--border-strong);\n}\n.btn-secondary:hover { color: var(--text-heading); border-color: var(--accent-primary); }\n\n/* ---------- Sections ---------- */\n.section { padding: 72px 0; border-top: 1px solid var(--border-default); }\n.section h2 {\n  font-size: var(--text-2xl);\n  font-weight: var(--weight-bold);\n  margin: 0 0 24px;\n  text-wrap: pretty;\n}\n.section .body-copy {\n  max-width: 66ch;\n  font-size: var(--text-md);\n  line-height: var(--leading-body);\n}\n.section .body-copy p { margin: 0 0 20px; }\n\n/* Three-seat grid */\n.seat-grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 24px;\n  margin-top: 40px;\n}\n.seat {\n  border: 1px solid var(--border-default);\n  border-top: 3px solid var(--accent-primary);\n  border-radius: 3px;\n  background: var(--surface-card);\n  padding: 28px 24px;\n}\n.seat h3 {\n  font-family: var(--font-body);\n  font-size: var(--text-sm);\n  font-weight: var(--weight-bold);\n  letter-spacing: var(--tracking-wide);\n  text-transform: uppercase;\n  color: var(--text-heading);\n  margin: 0 0 12px;\n}\n.seat p { margin: 0; font-size: var(--text-sm); line-height: var(--leading-body); color: var(--text-body); }\n\n/* Pull quote */\n.promise {\n  border-left: 3px solid var(--accent-danger);\n  padding: 8px 0 8px 28px;\n  margin: 40px 0 0;\n}\n.promise p {\n  font-family: var(--font-display);\n  font-size: var(--text-xl);\n  line-height: var(--leading-heading);\n  color: var(--text-heading);\n  margin: 0;\n  max-width: 34ch;\n  text-wrap: pretty;\n}\n\n/* ---------- Product cards ---------- */\n.product-grid {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 24px;\n  margin-top: 40px;\n}\n.product {\n  border: 1px solid var(--border-default);\n  border-radius: 3px;\n  background: var(--surface-card);\n  padding: 28px;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n}\n.product .num {\n  font-family: var(--font-stencil);\n  font-size: var(--text-lg);\n  color: var(--oac-rose);\n}\n.product h3 {\n  font-size: var(--text-lg);\n  font-weight: var(--weight-bold);\n  margin: 0;\n}\n.product p { margin: 0; font-size: var(--text-sm); line-height: var(--leading-body); flex: 1; }\n.badge {\n  align-self: flex-start;\n  font-family: var(--font-body);\n  font-size: var(--text-xs);\n  font-weight: var(--weight-semibold);\n  letter-spacing: var(--tracking-wide);\n  text-transform: uppercase;\n  color: var(--text-muted);\n  border: 1px solid var(--border-default);\n  border-radius: 2px;\n  padding: 4px 10px;\n}\n\n/* ---------- Contact ---------- */\n.contact-list {\n  display: grid;\n  gap: 0;\n  margin-top: 40px;\n  border-top: 1px solid var(--border-default);\n  max-width: 640px;\n}\n.contact-list .row {\n  display: grid;\n  grid-template-columns: 160px 1fr;\n  gap: 24px;\n  padding: 20px 0;\n  border-bottom: 1px solid var(--border-default);\n  align-items: baseline;\n}\n.contact-list .label {\n  font-family: var(--font-body);\n  font-size: var(--text-xs);\n  font-weight: var(--weight-semibold);\n  letter-spacing: var(--tracking-wide);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n.contact-list .value { font-size: var(--text-md); }\n.contact-list .value a { text-decoration: none; }\n.contact-list .value a:hover { text-decoration: underline; }\n\n/* ---------- Footer ---------- */\n.site-footer {\n  border-top: 1.5px solid var(--border-strong);\n  margin-top: 72px;\n  padding: 40px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 24px;\n  flex-wrap: wrap;\n}\n.site-footer img { height: 28px; opacity: 0.85; }\n.site-footer p {\n  margin: 0;\n  font-size: var(--text-xs);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n.site-footer nav { display: flex; gap: 24px; }\n.site-footer nav a {\n  font-size: var(--text-xs);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  text-decoration: none;\n  color: var(--text-muted);\n}\n.site-footer nav a:hover { color: var(--link-hover); }\n\n/* ---------- Responsive ---------- */\n@media (max-width: 860px) {\n  .site-nav { padding: 16px 20px; }\n  .site-nav ul { gap: 18px; }\n  .page { padding: 0 20px; }\n  .hero { padding: 64px 0 56px; }\n  .seat-grid, .product-grid { grid-template-columns: 1fr; }\n  .contact-list .row { grid-template-columns: 1fr; gap: 4px; }\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<header class=\"site-nav\">\n  <a class=\"brand\" href=\"index.html\">\n    <img src=\"2f53c787-be7b-48db-9aa1-9a25af9b5862\" alt=\"OAC\">\n    <span>Owners · Architects · Contractors<\u002Fspan>\n  <\u002Fa>\n  <nav>\n    <ul>\n      <li><a href=\"index.html\" aria-current=\"page\">Home<\u002Fa><\u002Fli>\n      <li><a href=\"about.html\">About<\u002Fa><\u002Fli>\n      <li><a href=\"products.html\">Products<\u002Fa><\u002Fli>\n      <li><a href=\"contact.html\">Contact<\u002Fa><\u002Fli>\n    <\u002Ful>\n  <\u002Fnav>\n<\u002Fheader>\n\n<main class=\"page\">\n\n  <section class=\"hero\" data-screen-label=\"Home hero\">\n    <img class=\"mark\" src=\"2f53c787-be7b-48db-9aa1-9a25af9b5862\" alt=\"OAC logomark\">\n    <p class=\"disciplines\">Owners + Architects + Contractors<\u002Fp>\n    <h1>Project problems are rarely technical. They're jurisdictional.<\u002Fh1>\n    <p class=\"lede\">After 30 years in all three seats — owner, architect, contractor — I write about the gaps between the disciplines, and what it takes to navigate them.<\u002Fp>\n    <p class=\"byline\">Salvatore J. Raffone, AIA<small>Founder · OAC<\u002Fsmall><\u002Fp>\n    <div class=\"btn-row\">\n      <a class=\"btn btn-primary\" href=\"https://salvatoreraffone.substack.com/\" target=\"_blank\" rel=\"noopener\">Subscribe on Substack<\u002Fa>\n      <a class=\"btn btn-secondary\" href=\"about.html\">About OAC<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"section\" data-screen-label=\"Three seats\">\n    <p class=\"eyebrow\"><span class=\"tick\">+<\u002Fspan>The Three Seats<\u002Fp>\n    <h2>One project. Three disciplines. Persistent friction.<\u002Fh2>\n    <p class=\"body-copy\">Owners, architects, and contractors make decisions that affect each other every day — yet few possess deep working knowledge across all three. OAC exists to make collaboration across the disciplines legible, practical, and advisable.<\u002Fp>\n    <div class=\"seat-grid\">\n      <article class=\"seat\">\n        <h3>Owners<\u002Fh3>\n        <p>Rising costs force constant trade-offs between quality and control. Development strategy, capital, entitlements, and risk — seen from the seat that pays for it all.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"seat\">\n        <h3>Architects<\u002Fh3>\n        <p>Escalating code complexity, compressed fees, and pressure to cut design to the bone. Design intent meeting construction reality.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"seat\">\n        <h3>Contractors<\u002Fh3>\n        <p>Procurement delays, scoping complexity, and cost increases — often with the least control over decisions made upstream. Delivery is where every gap surfaces.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n    <blockquote class=\"promise\">\n      <p>If you read OAC, you will spot collaborative opportunities between the disciplines and better navigate the complexities of your own.<\u002Fp>\n    <\u002Fblockquote>\n  <\u002Fsection>\n\n<\u002Fmain>\n\n<footer class=\"site-footer\">\n  <img src=\"2f53c787-be7b-48db-9aa1-9a25af9b5862\" alt=\"OAC\">\n  <p>Precision + Craft · Construction + Theory<\u002Fp>\n  <nav>\n    <a href=\"https://salvatoreraffone.substack.com/\" target=\"_blank\" rel=\"noopener\">Substack<\u002Fa>\n    <a href=\"https://www.linkedin.com/in/salvatore-j-raffone-aia-b1a85b1/\" target=\"_blank\" rel=\"noopener\">LinkedIn<\u002Fa>\n    <a href=\"contact.html\">Contact<\u002Fa>\n  <\u002Fnav>\n<\u002Ffooter>\n\n\n\n<\u002Fbody><\u002Fhtml>"
